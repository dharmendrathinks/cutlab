name: Android device tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    name: API 35 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build instrumentation APKs
        run: ./scripts/gradle.sh :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Install independent media verifier
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run device suite
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          heap-size: 512M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./scripts/device-check.sh
      - name: Verify exported A/V timing independently
        run: python3 scripts/check-av-sync.py artifacts/engine-av-sync.mp4 --output artifacts/ffmpeg-av-sync.json
      - name: Upload device diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: device-api35-${{ github.sha }}
          path: artifacts/
          retention-days: 14
