name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Repository, JVM, build and lint checks
        run: ./scripts/check.sh
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-${{ github.sha }}
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/
          retention-days: 14
      - name: Package development APK with notices and checksum
        run: |
          mkdir -p artifacts/development
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/development/CutLab-debug.apk
          cp LICENSE THIRD_PARTY_NOTICES.md artifacts/development/
          cp -R licenses artifacts/development/
          printf '%s\n' "$GITHUB_SHA" > artifacts/development/COMMIT
          cd artifacts/development
          sha256sum CutLab-debug.apk > SHA256SUMS
      - name: Upload development APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cutlab-debug-${{ github.sha }}
          path: artifacts/development/
          if-no-files-found: error
          retention-days: 14
